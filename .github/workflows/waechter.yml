name: Kennzeichen-Waechter

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waechter
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - name: Kurze Kennzeichen abfragen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 waechter.py

      - name: Zustand sichern (nur bei Aenderung)
        run: |
          git config user.name "kennzeichen-waechter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zustand.json
          if ! git diff --cached --quiet; then
            git commit -m "Zustand $(date -u +'%d.%m. %H:%M') UTC"
            git push
          fi
